<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static QR Code Generator Widget</title>
  <!-- Load qrcode-generator from reliable CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Load Inter font for clean modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Host page demo wrapper (optional when embedding just .qr-widget-root) */
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0514;
      box-sizing: border-box;
    }

    /* ==========================================================================
       SCOPED WIDGET STYLES (.qr-widget-root)
       Uses explicit CSS variables, strict scoping, and property resets so the
       widget remains visually isolated when embedded inside any host website.
       ========================================================================== */
    .qr-widget-root {
      --qrw-bg-card: #160c28;
      --qrw-bg-subtle: #100720;
      --qrw-bg-surface: #22123b;
      --qrw-bg-input: #0e061a;
      --qrw-border: #331c54;
      --qrw-border-hover: #4c2a7d;
      --qrw-border-focus: #ff1e96;
      --qrw-text-primary: #f8f5ff;
      --qrw-text-secondary: #b8a6d9;
      --qrw-text-muted: #8a73b3;
      --qrw-accent: #e6007e;
      --qrw-accent-bright: #ff1e96;
      --qrw-accent-hover: #ff3da4;
      --qrw-accent-soft: rgba(230, 0, 126, 0.16);
      --qrw-accent-glow: rgba(230, 0, 126, 0.28);
      --qrw-success: #34d399;
      --qrw-success-bg: rgba(16, 185, 129, 0.14);
      --qrw-success-border: rgba(52, 211, 153, 0.35);
      --qrw-warning-text: #fde68a;
      --qrw-warning-bg: rgba(245, 158, 11, 0.14);
      --qrw-warning-border: rgba(245, 158, 11, 0.35);
      --qrw-shadow: 0 20px 40px -10px rgba(4, 1, 10, 0.75), 0 0 0 1px rgba(230, 0, 126, 0.08);
      --qrw-radius-lg: 16px;
      --qrw-radius-md: 10px;
      --qrw-radius-sm: 6px;
      --qrw-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --qrw-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      all: initial;
      display: block;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      font-family: var(--qrw-font-sans);
      color: var(--qrw-text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .qr-widget-root *,
    .qr-widget-root *::before,
    .qr-widget-root *::after {
      box-sizing: border-box;
      font-family: inherit;
    }

    .qr-widget-root .qrw-card {
      background-color: var(--qrw-bg-card);
      border: 1px solid var(--qrw-border);
      border-radius: var(--qrw-radius-lg);
      box-shadow: var(--qrw-shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
    }

    @media (min-width: 720px) {
      .qr-widget-root .qrw-card {
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    /* Left Column: Configuration & Controls */
    .qr-widget-root .qrw-controls-pane {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (min-width: 720px) {
      .qr-widget-root .qrw-controls-pane {
        padding: 32px;
        border-right: 1px solid var(--qrw-border);
      }
    }

    .qr-widget-root .qrw-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .qr-widget-root .qrw-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 3px 10px;
      border-radius: 999px;
      background-color: var(--qrw-accent-soft);
      border: 1px solid rgba(255, 30, 150, 0.28);
      color: var(--qrw-accent-hover);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .qr-widget-root .qrw-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--qrw-accent-bright);
      box-shadow: 0 0 8px var(--qrw-accent-bright);
    }

    .qr-widget-root .qrw-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--qrw-text-primary);
      letter-spacing: -0.02em;
    }

    .qr-widget-root .qrw-subtitle {
      margin: 0;
      font-size: 13.5px;
      color: var(--qrw-text-secondary);
    }

    /* Form Groups */
    .qr-widget-root .qrw-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .qr-widget-root .qrw-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .qr-widget-root .qrw-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--qrw-text-primary);
    }

    .qr-widget-root .qrw-hint {
      font-size: 12px;
      color: var(--qrw-text-muted);
      font-family: var(--qrw-font-mono);
    }

    .qr-widget-root .qrw-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .qr-widget-root .qrw-text-input {
      width: 100%;
      padding: 10px 36px 10px 12px;
      font-size: 14px;
      color: var(--qrw-text-primary);
      background-color: var(--qrw-bg-input);
      border: 1px solid var(--qrw-border);
      border-radius: var(--qrw-radius-md);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .qr-widget-root .qrw-text-input::placeholder {
      color: var(--qrw-text-muted);
    }

    .qr-widget-root .qrw-text-input:focus {
      border-color: var(--qrw-border-focus);
      box-shadow: 0 0 0 3px var(--qrw-accent-glow);
    }

    .qr-widget-root .qrw-clear-btn {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--qrw-text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .qr-widget-root .qrw-clear-btn:hover {
      color: var(--qrw-text-primary);
      background-color: var(--qrw-bg-surface);
    }

    /* Color Pickers Grid */
    .qr-widget-root .qrw-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .qr-widget-root .qrw-color-control {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background-color: var(--qrw-bg-input);
      border: 1px solid var(--qrw-border);
      border-radius: var(--qrw-radius-md);
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .qr-widget-root .qrw-color-control:focus-within {
      border-color: var(--qrw-border-focus);
      box-shadow: 0 0 0 3px var(--qrw-accent-glow);
    }

    .qr-widget-root .qrw-color-swatch {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      padding: 0;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
    }

    .qr-widget-root .qrw-color-swatch::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .qr-widget-root .qrw-color-swatch::-webkit-color-swatch {
      border: 1px solid rgba(248, 245, 255, 0.22);
      border-radius: 6px;
    }

    .qr-widget-root .qrw-color-swatch::-moz-color-swatch {
      border: 1px solid rgba(248, 245, 255, 0.22);
      border-radius: 6px;
    }

    .qr-widget-root .qrw-hex-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--qrw-font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--qrw-text-primary);
      text-transform: uppercase;
    }

    /* Range Slider */
    .qr-widget-root .qrw-range-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .qr-widget-root .qrw-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--qrw-bg-surface);
      border: 1px solid var(--qrw-border);
      outline: none;
      cursor: pointer;
    }

    .qr-widget-root .qrw-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--qrw-accent-bright);
      border: 2px solid var(--qrw-text-primary);
      box-shadow: 0 0 10px var(--qrw-accent-glow);
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .qr-widget-root .qrw-range::-webkit-slider-thumb:hover {
      transform: scale(1.12);
      background: var(--qrw-accent-hover);
    }

    .qr-widget-root .qrw-range::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--qrw-accent-bright);
      border: 2px solid var(--qrw-text-primary);
      box-shadow: 0 0 10px var(--qrw-accent-glow);
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    /* Segmented Control for Error Correction */
    .qr-widget-root .qrw-segmented {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 4px;
      background-color: var(--qrw-bg-input);
      border: 1px solid var(--qrw-border);
      border-radius: var(--qrw-radius-md);
    }

    .qr-widget-root .qrw-seg-btn {
      border: 1px solid transparent;
      background: transparent;
      padding: 7px 6px;
      border-radius: var(--qrw-radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--qrw-text-secondary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      transition: all 0.15s ease;
    }

    .qr-widget-root .qrw-seg-btn span.qrw-seg-sub {
      font-size: 10px;
      font-weight: 400;
      opacity: 0.8;
    }

    .qr-widget-root .qrw-seg-btn:hover:not(.is-active) {
      color: var(--qrw-text-primary);
      background-color: var(--qrw-bg-surface);
    }

    .qr-widget-root .qrw-seg-btn.is-active {
      background-color: var(--qrw-accent-soft);
      border-color: rgba(255, 30, 150, 0.45);
      color: var(--qrw-accent-hover);
      box-shadow: 0 2px 10px rgba(230, 0, 126, 0.2);
    }

    /* Contrast Warning Banner */
    .qr-widget-root .qrw-alert {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--qrw-radius-md);
      background-color: var(--qrw-warning-bg);
      border: 1px solid var(--qrw-warning-border);
      color: var(--qrw-warning-text);
      font-size: 12.5px;
      line-height: 1.45;
      animation: qrwFadeIn 0.2s ease;
    }

    .qr-widget-root .qrw-alert.is-visible {
      display: flex;
    }

    .qr-widget-root .qrw-alert-icon {
      flex-shrink: 0;
      margin-top: 1px;
    }

    .qr-widget-root .qrw-swap-link {
      background: none;
      border: none;
      padding: 0;
      color: #ffffff;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
      margin-left: 4px;
    }

    /* Right Column: Live Preview & Export */
    .qr-widget-root .qrw-preview-pane {
      background-color: var(--qrw-bg-subtle);
      background-image: radial-gradient(circle at 50% 35%, rgba(230, 0, 126, 0.12), transparent 68%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    @media (min-width: 720px) {
      .qr-widget-root .qrw-preview-pane {
        padding: 32px 24px;
      }
    }

    .qr-widget-root .qrw-stage {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 240px;
    }

    .qr-widget-root .qrw-canvas-frame {
      position: relative;
      padding: 14px;
      background-color: #ffffff;
      border: 1px solid var(--qrw-border);
      border-radius: var(--qrw-radius-md);
      box-shadow: 0 12px 28px rgba(4, 1, 10, 0.55), 0 0 0 1px rgba(255, 30, 150, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      max-width: 100%;
    }

    .qr-widget-root .qrw-canvas-frame:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(4, 1, 10, 0.65), 0 0 20px rgba(230, 0, 126, 0.28);
    }

    .qr-widget-root .qrw-canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .qr-widget-root .qrw-meta-bar {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      color: var(--qrw-text-secondary);
      font-family: var(--qrw-font-mono);
    }

    /* Export Buttons */
    .qr-widget-root .qrw-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .qr-widget-root .qrw-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .qr-widget-root .qrw-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 14px;
      border-radius: var(--qrw-radius-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      user-select: none;
    }

    .qr-widget-root .qrw-btn:active {
      transform: scale(0.98);
    }

    .qr-widget-root .qrw-btn-primary {
      background: linear-gradient(135deg, var(--qrw-accent) 0%, var(--qrw-accent-bright) 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--qrw-accent-glow);
    }

    .qr-widget-root .qrw-btn-primary:hover {
      background: linear-gradient(135deg, var(--qrw-accent-bright) 0%, var(--qrw-accent-hover) 100%);
      box-shadow: 0 6px 18px rgba(255, 30, 150, 0.42);
    }

    .qr-widget-root .qrw-btn-secondary {
      background-color: var(--qrw-bg-surface);
      color: var(--qrw-text-primary);
      border-color: var(--qrw-border);
    }

    .qr-widget-root .qrw-btn-secondary:hover {
      background-color: #2c174d;
      border-color: var(--qrw-border-hover);
    }

    .qr-widget-root .qrw-btn-copy {
      width: 100%;
      background-color: var(--qrw-bg-surface);
      color: var(--qrw-text-primary);
      border-color: var(--qrw-border);
    }

    .qr-widget-root .qrw-btn-copy:hover {
      background-color: #2c174d;
      border-color: var(--qrw-border-hover);
    }

    .qr-widget-root .qrw-btn-copy.is-copied {
      background-color: var(--qrw-success-bg);
      border-color: var(--qrw-success-border);
      color: var(--qrw-success);
    }

    /* Toast feedback inside preview pane */
    .qr-widget-root .qrw-toast {
      font-size: 12px;
      font-weight: 500;
      color: var(--qrw-text-secondary);
      text-align: center;
      min-height: 18px;
      transition: opacity 0.2s ease;
    }

    .qr-widget-root .qrw-toast a {
      color: var(--qrw-accent-hover);
      font-weight: 600;
      text-decoration: underline;
    }

    @keyframes qrwFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Self-Contained QR Code Generator Widget -->
  <div class="qr-widget-root" id="static-qr-widget">
    <div class="qrw-card">
      
      <!-- Left Column: Controls -->
      <div class="qrw-controls-pane">
        <div class="qrw-header">
          <div class="qrw-badge">
            <span class="qrw-badge-dot"></span>
            100% Client-Side &bull; Static
          </div>
          <h2 class="qrw-title">QR Code Generator</h2>
          <p class="qrw-subtitle">Direct encoding with zero tracking or redirect servers.</p>
        </div>

        <!-- Text / URL Input -->
        <div class="qrw-field">
          <div class="qrw-label-row">
            <label class="qrw-label" for="qrw-input-text">Destination URL or Text</label>
            <span class="qrw-hint" id="qrw-char-count">24 chars</span>
          </div>
          <div class="qrw-input-wrap">
            <input
              type="text"
              id="qrw-input-text"
              class="qrw-text-input"
              value="https://subdomain.domain"
              placeholder="Enter URL or text..."
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" id="qrw-clear-btn" class="qrw-clear-btn" title="Clear input" aria-label="Clear input">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Colors -->
        <div class="qrw-grid-2">
          <div class="qrw-field">
            <label class="qrw-label" for="qrw-fg-color">Foreground</label>
            <div class="qrw-color-control">
              <input type="color" id="qrw-fg-color" class="qrw-color-swatch" value="#0F172A" aria-label="Foreground color picker" />
              <input type="text" id="qrw-fg-hex" class="qrw-hex-input" value="#0F172A" maxlength="7" aria-label="Foreground hex value" />
            </div>
          </div>

          <div class="qrw-field">
            <label class="qrw-label" for="qrw-bg-color">Background</label>
            <div class="qrw-color-control">
              <input type="color" id="qrw-bg-color" class="qrw-color-swatch" value="#FFFFFF" aria-label="Background color picker" />
              <input type="text" id="qrw-bg-hex" class="qrw-hex-input" value="#FFFFFF" maxlength="7" aria-label="Background hex value" />
            </div>
          </div>
        </div>

        <!-- Low Contrast Warning -->
        <div class="qrw-alert" id="qrw-contrast-alert" role="alert">
          <svg class="qrw-alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <div>
            <strong>Low contrast (<span id="qrw-contrast-ratio">1.0</span>:1):</strong> Scanners need a dark foreground on a light background.
            <button type="button" class="qrw-swap-link" id="qrw-fix-contrast">Fix contrast</button>
          </div>
        </div>

        <!-- Export Pixel Size -->
        <div class="qrw-field">
          <div class="qrw-label-row">
            <label class="qrw-label" for="qrw-size-range">Export Resolution</label>
            <span class="qrw-hint" id="qrw-size-value">512 &times; 512 px</span>
          </div>
          <div class="qrw-range-wrap">
            <input
              type="range"
              id="qrw-size-range"
              class="qrw-range"
              min="128"
              max="1024"
              step="64"
              value="512"
            />
          </div>
        </div>

        <!-- Error Correction Level -->
        <div class="qrw-field">
          <div class="qrw-label-row">
            <span class="qrw-label">Error Correction</span>
            <span class="qrw-hint" id="qrw-ec-desc">15% recovery</span>
          </div>
          <div class="qrw-segmented" role="group" aria-label="Error Correction Level">
            <button type="button" class="qrw-seg-btn" data-ec="L">
              L
              <span class="qrw-seg-sub">7%</span>
            </button>
            <button type="button" class="qrw-seg-btn is-active" data-ec="M">
              M
              <span class="qrw-seg-sub">15%</span>
            </button>
            <button type="button" class="qrw-seg-btn" data-ec="Q">
              Q
              <span class="qrw-seg-sub">25%</span>
            </button>
            <button type="button" class="qrw-seg-btn" data-ec="H">
              H
              <span class="qrw-seg-sub">30%</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Right Column: Live Preview & Exports -->
      <div class="qrw-preview-pane">
        <div class="qrw-stage">
          <div class="qrw-canvas-frame" id="qrw-canvas-frame">
            <canvas id="qrw-canvas" class="qrw-canvas" width="240" height="240"></canvas>
          </div>
          <div class="qrw-meta-bar">
            <span id="qrw-matrix-info">25&times;25 modules</span>
            <span>&bull;</span>
            <span id="qrw-ec-badge">ECC-M</span>
          </div>
        </div>

        <div class="qrw-actions">
          <div class="qrw-btn-row">
            <button type="button" id="qrw-download-png" class="qrw-btn qrw-btn-primary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              PNG
            </button>
            <button type="button" id="qrw-download-svg" class="qrw-btn qrw-btn-secondary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
              SVG
            </button>
          </div>

          <button type="button" id="qrw-copy-btn" class="qrw-btn qrw-btn-copy">
            <svg id="qrw-copy-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="qrw-copy-label">Copy Image to Clipboard</span>
          </button>

          <div class="qrw-toast" id="qrw-status-msg" aria-live="polite"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // Ensure library loaded
      if (typeof window.qrcode === 'undefined') {
        console.error('QRCode library failed to load.');
        return;
      }

      // Use UTF-8 byte mode for full international & special character support
      window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs['UTF-8'];

      // Widget State
      const state = {
        text: 'https://subdomain.domain',
        fgColor: '#0F172A',
        bgColor: '#FFFFFF',
        size: 512,
        ecLevel: 'M', // L, M, Q, H
        quietZoneModules: 3 // Clean 3-module quiet zone border
      };

      const ecDescriptions = {
        L: '7% recovery',
        M: '15% recovery',
        Q: '25% recovery',
        H: '30% recovery'
      };

      // DOM References
      const elInput = document.getElementById('qrw-input-text');
      const elClearBtn = document.getElementById('qrw-clear-btn');
      const elCharCount = document.getElementById('qrw-char-count');
      const elFgColor = document.getElementById('qrw-fg-color');
      const elFgHex = document.getElementById('qrw-fg-hex');
      const elBgColor = document.getElementById('qrw-bg-color');
      const elBgHex = document.getElementById('qrw-bg-hex');
      const elContrastAlert = document.getElementById('qrw-contrast-alert');
      const elContrastRatio = document.getElementById('qrw-contrast-ratio');
      const elFixContrast = document.getElementById('qrw-fix-contrast');
      const elSizeRange = document.getElementById('qrw-size-range');
      const elSizeValue = document.getElementById('qrw-size-value');
      const elEcButtons = document.querySelectorAll('.qrw-seg-btn');
      const elEcDesc = document.getElementById('qrw-ec-desc');
      const elCanvas = document.getElementById('qrw-canvas');
      const elCanvasFrame = document.getElementById('qrw-canvas-frame');
      const elMatrixInfo = document.getElementById('qrw-matrix-info');
      const elEcBadge = document.getElementById('qrw-ec-badge');
      const elDownloadPng = document.getElementById('qrw-download-png');
      const elDownloadSvg = document.getElementById('qrw-download-svg');
      const elCopyBtn = document.getElementById('qrw-copy-btn');
      const elCopyLabel = document.getElementById('qrw-copy-label');
      const elStatusMsg = document.getElementById('qrw-status-msg');

      let copyResetTimer = null;
      let statusTimer = null;

      /**
       * Normalize 3-digit or 6-digit hex string to #RRGGBB
       */
      function normalizeHex(val) {
        let hex = val.trim().replace(/^#/, '');
        if (/^[0-9a-fA-F]{3}$/.test(hex)) {
          hex = hex.split('').map((c) => c + c).join('');
        }
        if (/^[0-9a-fA-F]{6}$/.test(hex)) {
          return '#' + hex.toUpperCase();
        }
        return null;
      }

      /**
       * Calculate WCAG relative luminance & contrast ratio between two hex colors
       */
      function getContrastRatio(hex1, hex2) {
        const lum = (hex) => {
          const rgb = [
            parseInt(hex.slice(1, 3), 16) / 255,
            parseInt(hex.slice(3, 5), 16) / 255,
            parseInt(hex.slice(5, 7), 16) / 255
          ].map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
          return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
        };
        const l1 = lum(hex1);
        const l2 = lum(hex2);
        return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
      }

      /**
       * Show temporary status message below export buttons
       */
      function showStatus(msgHtml) {
        elStatusMsg.innerHTML = msgHtml;
        elStatusMsg.style.opacity = '1';
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => {
          elStatusMsg.style.opacity = '0';
        }, 4500);
      }

      /**
       * Check foreground/background contrast and warn if scanning may fail
       */
      function checkContrast() {
        const ratio = getContrastRatio(state.fgColor, state.bgColor);
        elContrastRatio.textContent = ratio.toFixed(1);
        if (ratio < 3.0) {
          elContrastAlert.classList.add('is-visible');
        } else {
          elContrastAlert.classList.remove('is-visible');
        }
      }

      /**
       * Build QR matrix using auto typeNumber (0) and specified error correction
       */
      function buildQrMatrix(text, ecLevel) {
        const payload = text.length > 0 ? text : ' ';
        const qr = window.qrcode(0, ecLevel);
        qr.addData(payload, 'Byte');
        qr.make();
        return qr;
      }

      /**
       * Render QR matrix onto any HTML5 Canvas at exact square pixel resolution
       */
      function renderToCanvas(canvas, qr, targetSizePx, fgColor, bgColor, quietModules) {
        const count = qr.getModuleCount();
        const totalModules = count + quietModules * 2;
        const cellSize = targetSizePx / totalModules;
        const ctx = canvas.getContext('2d');

        canvas.width = targetSizePx;
        canvas.height = targetSizePx;

        // Fill background including quiet zone
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, targetSizePx, targetSizePx);

        // Calculate exact module pixel bounds to eliminate sub-pixel anti-aliasing seams
        ctx.fillStyle = fgColor;

        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (qr.isDark(row, col)) {
              const x = Math.floor((col + quietModules) * cellSize);
              const y = Math.floor((row + quietModules) * cellSize);
              const w = Math.ceil((col + quietModules + 1) * cellSize) - x;
              const h = Math.ceil((row + quietModules + 1) * cellSize) - y;
              ctx.fillRect(x, y, w, h);
            }
          }
        }
      }

      /**
       * Trigger file download via Blob URL (with sandboxed iframe fallback)
       */
      function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // If running inside a sandboxed preview iframe, offer a direct new-tab link
        if (window.self !== window.top) {
          showStatus(`Blocked by preview sandbox? <a href="${url}" target="_blank" rel="noopener">Open file in new tab</a>`);
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } else {
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
      }

      /**
       * Generate clean filename slug from input text
       */
      function getFilename(ext) {
        const clean = state.text
          .replace(/^https?:\/\//i, '')
          .replace(/[^a-z0-9]+/gi, '-')
          .replace(/^-+|-+$/g, '')
          .slice(0, 28)
          .toLowerCase();
        return `qr-${clean || 'code'}-${state.size}px.${ext}`;
      }

      /**
       * Build a clean, single-path scalable vector SVG string
       */
      function buildSvgString(qr, targetSizePx, fgColor, bgColor, quietModules) {
        const count = qr.getModuleCount();
        const totalModules = count + quietModules * 2;
        let pathData = '';

        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (qr.isDark(row, col)) {
              const x = col + quietModules;
              const y = row + quietModules;
              pathData += `M${x} ${y}h1v1h-1z`;
            }
          }
        }

        return [
          `<?xml version="1.0" encoding="UTF-8"?>`,
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalModules} ${totalModules}" width="${targetSizePx}" height="${targetSizePx}" shape-rendering="crispEdges">`,
          `  <rect width="${totalModules}" height="${totalModules}" fill="${bgColor}"/>`,
          `  <path d="${pathData}" fill="${fgColor}"/>`,
          `</svg>`
        ].join('\n');
      }

      /**
       * Main render & UI synchronization loop
       */
      function updateWidget() {
        const len = state.text.length;
        elCharCount.textContent = `${len} char${len === 1 ? '' : 's'}`;
        elClearBtn.style.visibility = len > 0 ? 'visible' : 'hidden';

        elSizeValue.innerHTML = `${state.size} &times; ${state.size} px`;
        elEcDesc.textContent = ecDescriptions[state.ecLevel];
        elEcBadge.textContent = `ECC-${state.ecLevel}`;
        elCanvasFrame.style.backgroundColor = state.bgColor;

        checkContrast();

        try {
          const qr = buildQrMatrix(state.text, state.ecLevel);
          const count = qr.getModuleCount();
          elMatrixInfo.innerHTML = `${count}&times;${count} modules`;

          // Render crisp preview at 2x devicePixelRatio (240px CSS size -> 480px backing buffer)
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const previewPx = Math.round(240 * dpr);
          renderToCanvas(elCanvas, qr, previewPx, state.fgColor, state.bgColor, state.quietZoneModules);
        } catch (err) {
          elMatrixInfo.textContent = 'Text too long for QR capacity';
          const ctx = elCanvas.getContext('2d');
          ctx.fillStyle = state.bgColor;
          ctx.fillRect(0, 0, elCanvas.width, elCanvas.height);
        }
      }

      // --- Event Listeners ---

      elInput.addEventListener('input', (e) => {
        state.text = e.target.value;
        updateWidget();
      });

      elClearBtn.addEventListener('click', () => {
        state.text = '';
        elInput.value = '';
        elInput.focus();
        updateWidget();
      });

      // Foreground color sync
      elFgColor.addEventListener('input', (e) => {
        state.fgColor = e.target.value.toUpperCase();
        elFgHex.value = state.fgColor;
        updateWidget();
      });

      elFgHex.addEventListener('input', (e) => {
        const normalized = normalizeHex(e.target.value);
        if (normalized) {
          state.fgColor = normalized;
          elFgColor.value = normalized;
          updateWidget();
        }
      });

      elFgHex.addEventListener('blur', () => {
        elFgHex.value = state.fgColor;
      });

      // Background color sync
      elBgColor.addEventListener('input', (e) => {
        state.bgColor = e.target.value.toUpperCase();
        elBgHex.value = state.bgColor;
        updateWidget();
      });

      elBgHex.addEventListener('input', (e) => {
        const normalized = normalizeHex(e.target.value);
        if (normalized) {
          state.bgColor = normalized;
          elBgColor.value = normalized;
          updateWidget();
        }
      });

      elBgHex.addEventListener('blur', () => {
        elBgHex.value = state.bgColor;
      });

      // Fix low contrast button
      elFixContrast.addEventListener('click', () => {
        state.fgColor = '#0F172A';
        state.bgColor = '#FFFFFF';
        elFgColor.value = state.fgColor;
        elFgHex.value = state.fgColor;
        elBgColor.value = state.bgColor;
        elBgHex.value = state.bgColor;
        updateWidget();
      });

      // Pixel size slider
      elSizeRange.addEventListener('input', (e) => {
        state.size = parseInt(e.target.value, 10);
        updateWidget();
      });

      // Error correction level buttons
      elEcButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          elEcButtons.forEach((b) => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          state.ecLevel = btn.getAttribute('data-ec');
          updateWidget();
        });
      });

      // Download PNG
      elDownloadPng.addEventListener('click', () => {
        try {
          const qr = buildQrMatrix(state.text, state.ecLevel);
          const offscreen = document.createElement('canvas');
          renderToCanvas(offscreen, qr, state.size, state.fgColor, state.bgColor, state.quietZoneModules);
          offscreen.toBlob((blob) => {
            if (blob) {
              showStatus(`Generated ${state.size}×${state.size}px PNG`);
              triggerDownload(blob, getFilename('png'));
            }
          }, 'image/png');
        } catch (err) {
          showStatus('Unable to generate PNG.');
        }
      });

      // Download SVG
      elDownloadSvg.addEventListener('click', () => {
        try {
          const qr = buildQrMatrix(state.text, state.ecLevel);
          const svgContent = buildSvgString(qr, state.size, state.fgColor, state.bgColor, state.quietZoneModules);
          const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
          showStatus('Generated scalable vector SVG');
          triggerDownload(blob, getFilename('svg'));
        } catch (err) {
          showStatus('Unable to generate SVG.');
        }
      });

      // Copy Image to Clipboard
      elCopyBtn.addEventListener('click', async () => {
        try {
          const qr = buildQrMatrix(state.text, state.ecLevel);
          const offscreen = document.createElement('canvas');
          renderToCanvas(offscreen, qr, state.size, state.fgColor, state.bgColor, state.quietZoneModules);

          const blob = await new Promise((resolve) => offscreen.toBlob(resolve, 'image/png'));
          if (!blob) throw new Error('Canvas blob failed');

          if (navigator.clipboard && window.ClipboardItem) {
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blob })
            ]);

            // Visual confirmation state
            elCopyBtn.classList.add('is-copied');
            elCopyLabel.textContent = 'Copied PNG to Clipboard!';
            showStatus(`Copied ${state.size}×${state.size}px image`);

            clearTimeout(copyResetTimer);
            copyResetTimer = setTimeout(() => {
              elCopyBtn.classList.remove('is-copied');
              elCopyLabel.textContent = 'Copy Image to Clipboard';
            }, 2200);
          } else {
            showStatus('Clipboard image API unavailable in this browser context.');
          }
        } catch (err) {
          showStatus('Clipboard permission blocked—use PNG download instead.');
        }
      });

      // Initial render on load
      updateWidget();
    })();
  </script>
</body>
</html>
